spring:
  application:
    name: StoreVision
  jackson:
    property-naming-strategy: SNAKE_CASE
  messages:
    basename: i18n/messages
    encoding: UTF-8
  datasource:
    url: jdbc:postgresql://localhost:5432/storevision
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
