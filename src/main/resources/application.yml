server:
  port: 8080
spring:
  application:
    name: StoreVision
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATASOURCE_MAX_POOL_SIZE}
      connection-timeout: ${DATASOURCE_CONNECTION_TIMEOUT}
  liquibase:
    change-log: ${LIQUIBASE_CHANGE_LOG}
    enabled: true
    default-schema: ${LIQUIBASE_DEFAULT_SCHEMA}
    database-change-log-table: ${LIQUIBASE_CHANGE_LOG_TABLE}
    database-change-log-lock-table: ${LIQUIBASE_CHANGE_LOG_LOCK_TABLE}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 3600
  main:
    allow-bean-definition-overriding: true
  profiles:
    include:
      - authentication
      - logging
      - swagger
      - thymeleaf
  mvc:
    apiversion:
      use:
        header: X-API-Version
      default: v1
    log-request-details: true

app:
  oauth2:
    success-redirect-url: /
  audit:
    default-admin-email: ${AUDIT_DEFAULT_ADMIN_EMAIL:admin@storevision.local}
  order:
    tax-rate: ${ORDER_TAX_RATE:0.10}
