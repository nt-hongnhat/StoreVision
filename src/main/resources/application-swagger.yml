management:
  health:
    diskspace:
      enabled: true
    db:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
    resolve-schema-properties: true
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    filter: true
    operations-sorter: alpha
    tags-sorter: alpha
  model-and-view-allowed: true
  show-actuator: true
  writer-with-default-pretty-printer: true
  show-login-endpoint: true
  writer-with-order-by-keys: true
  show-oauth2-endpoints: true
  use-management-port: false
  enable-default-api-docs: true
  group-configs:
    - group: v1
      display-name: API V1
      paths-to-match:
        - /**
      paths-to-exclude:
        - /actuator/**
        - /login
        - /login/**
    - group: actuator
      display-name: Actuator
      paths-to-match:
        - /actuator/**
    - group: security
      display-name: Security
      paths-to-match:
        - /login
        - /login/**